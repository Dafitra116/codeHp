<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Itemsss</title>
  <style>
  .boxStore, .boxInventory{
    border: 2px black solid;
    margin: 5px;
    padding: 5px;
  }
  .containerItem{
    display: flex;
    gap: 5px;
    justify-content: space-evenly;
  }
  .boxItem, .itemInventory{
    border: 1px solid black;
    padding: 10px;
  }
  </style>
</head>
<body>
  <h1>
    item
  </h1>
  <div class="boxStore" id="boxStore">
    <p>Store</p>
    <div class="containerItem">
      <div class="itemStore" id="itemStore1">
        <div class="boxItem">
        <p>item 1</p>
        </div>
        <p id="jumlahItem1">2</p>
      </div>
      <div class="itemStore" id="itemStore2">
        <p>item 2</p>
        <p id="jumlahItem2">5</p>
      </div>
      <div class="itemStore" id="itemStore3">
        <p>item 3</p>
        <p id="jumlahItem3">7</p>
      </div>
      <div class="itemStore" id="itemStore4">
        <p>item 4</p>
        <p id="jumlahItem4">6</p>
      </div>
      <div class="itemStore" id="itemStore5">
        <p>item 5</p>
        <p id="jumlahItem5">3</p>
      </div>
    </div>
  </div>
  
  <div class="boxInventory" id="boxInventory">
    <p>yor Inventory</p>
    <div class="containerItem">
      <div class="itemInventory" id="itemInventory1"><p>item 1</p></div>
      <div class="itemInventory" id="itemInventory2"><p>item 2</p></div>
      <div class="itemInventory" id="itemInventory3"><p>item 3</p></div>
      <div class="itemInventory" id="itemInventory4"><p>item 4</p></div>
      <div class="itemInventory" id="itemInventory5"><p>item 5</p></div>
    </div>
  </div>
</body>
</html>
